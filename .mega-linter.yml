---
# MegaLinter configuration
# Docs: https://megalinter.io/configuration/

APPLY_FIXES: none
VALIDATE_ALL_CODEBASE: true

# Install dependencies (no lockfile in repo, so install not ci) so the repo's own eslint/stylelint configs resolve their
# plugins. Without this, flat-config ESLint fails on unresolvable imports.
PRE_COMMANDS:
  - command: npm install --prefer-offline --no-audit --no-fund --ignore-scripts
    cwd: workspace
    continue_if_failed: false
  - command: cd frontend && npm install --prefer-offline --no-audit --no-fund --ignore-scripts
    cwd: workspace
    continue_if_failed: false

# Point linters at this repo's flat configs; MegaLinter only probes for the
# legacy .eslintrc.* / .stylelintrc.* names and would otherwise stay inactive.
# MegaLinter bundles eslint 8.57, which cannot read flat config and is invoked
# with --eslintrc. Use the repo's own eslint 9 from node_modules instead.
JAVASCRIPT_ES_CLI_EXECUTABLE: ["node_modules/.bin/eslint"]
TYPESCRIPT_ES_CLI_EXECUTABLE: ["node_modules/.bin/eslint"]
JSX_ESLINT_CLI_EXECUTABLE: ["node_modules/.bin/eslint"]
TSX_ESLINT_CLI_EXECUTABLE: ["node_modules/.bin/eslint"]
CSS_STYLELINT_CLI_EXECUTABLE: ["frontend/node_modules/.bin/stylelint"]
SCSS_STYLELINT_CLI_EXECUTABLE: ["frontend/node_modules/.bin/stylelint"]

JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
TYPESCRIPT_ES_CONFIG_FILE: eslint.config.mjs
JSX_ESLINT_CONFIG_FILE: eslint.config.mjs
TSX_ESLINT_CONFIG_FILE: eslint.config.mjs
CSS_STYLELINT_CONFIG_FILE: frontend/stylelint.config.mjs
SCSS_STYLELINT_CONFIG_FILE: frontend/stylelint.config.mjs

# Semgrep is inactive unless given a ruleset
REPOSITORY_SEMGREP_ARGUMENTS: ["--config", "p/javascript", "--config", "p/typescript", "--config", "p/terraform"]

# i18n corpus spans ~40 languages; spell checking is meaningless here
DISABLE:
  - SPELL

# Conflicts with the repo's own eslint config
DISABLE_LINTERS:
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_STANDARD

SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALPACA: false
FLAVOR_SUGGESTIONS: true
REPORT_OUTPUT_FOLDER: megalinter-reports
SARIF_REPORTER: true
MARKDOWN_SUMMARY_REPORTER: true

FILTER_REGEX_EXCLUDE: (^|/)(node_modules|dist|build|coverage|vagrant|screenshots|\.git)/|/vendor/|\.min\.(js|css)$|^frontend/dist/

# Report but never gate on these
DISABLE_ERRORS_LINTERS:
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - REPOSITORY_GRYPE
