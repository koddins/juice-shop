---
# MegaLinter configuration
# Docs: https://megalinter.io/configuration/

APPLY_FIXES: none
VALIDATE_ALL_CODEBASE: true

# ESLint and stylelint are deliberately NOT run here. MegaLinter bundles eslint
# 8.57, which cannot read this repo's flat config, and making it work requires
# installing node_modules, which in turn makes the project-scope security
# scanners crawl it and blow past the job timeout. The repo's own ci.yml and
# lint-fixer.yml already run `npm run lint` with the correct eslint 9.
DISABLE_LINTERS:
  - JAVASCRIPT_ES
  - JAVASCRIPT_STANDARD
  - JAVASCRIPT_PRETTIER
  - TYPESCRIPT_ES
  - TYPESCRIPT_STANDARD
  - TYPESCRIPT_PRETTIER
  - JSX_ESLINT
  - TSX_ESLINT
  - CSS_STYLELINT
  - SCSS_STYLELINT

# Semgrep is inactive unless given a ruleset
REPOSITORY_SEMGREP_ARGUMENTS: ["--config", "p/javascript", "--config", "p/typescript", "--config", "p/terraform"]

# i18n corpus spans ~40 languages; spell checking is meaningless here
DISABLE:
  - SPELL

SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALPACA: false
FLAVOR_SUGGESTIONS: true
REPORT_OUTPUT_FOLDER: megalinter-reports
SARIF_REPORTER: true
MARKDOWN_SUMMARY_REPORTER: true

FILTER_REGEX_EXCLUDE: (^|/)(node_modules|dist|build|coverage|vagrant|screenshots|\.git)/|/vendor/|\.min\.(js|css)$|^frontend/dist/

# Report but never gate on these
DISABLE_ERRORS_LINTERS:
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - REPOSITORY_GRYPE
